[project]
authors = [
    {name = "Your Name", email = "you@example.com"},
]
requires-python = "<4.0,>=3.12"
dependencies = [
    "av==18.1.0",
    "click==8.5.0",
    "grpcio==1.83.0",
    "mypy-protobuf==5.1.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "protobuf==6.33.5",
    "pydantic==2.13.4",
]
name = "aipf-sample-stream-analyzer"
version = "0.1.0"
description = ""
readme = "README.md"
package-mode = false

[dependency-groups]
dev = [
    "grpcio-tools==1.81.1",
    "ruff==0.16.4",
]

[tool.ruff]
line-length = 110
exclude = ["*_pb2.py", "*_pb2_grpc.py", "*.pyi"]

[tool.ruff.lint]
extend-select = ["I"]

[[tool.mypy.overrides]]
module = "grpc"
ignore_missing_imports = true
